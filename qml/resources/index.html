const entries=JSON.parse(document.getElementById('data').textContent),params=new URLSearchParams(location.search);
const query=document.getElementById('query'),category=document.getElementById('category'),grid=document.getElementById('grid');
const contact=params.has('page');if(contact)document.body.classList.add('contact');
for(const text of [...new Set(entries.map(e=>e.category))].sort()){const option=document.createElement('option');option.value=text;option.textContent=text;category.append(option);}
query.value=params.get('q')||'';category.value=params.get('category')||'';
function render(){let items=entries.filter(e=>(!category.value||e.category===category.value)&&(!query.value||(e.file+' '+e.category+' '+e.origin).toLowerCase().includes(query.value.toLowerCase())));
const total=items.length,page=Math.max(0,Number(params.get('page'))||0);if(contact)items=items.slice(page*48,(page+1)*48);
grid.replaceChildren();for(const e of items){const card=document.createElement('article'),button=document.createElement('button'),img=document.createElement('img');img.src=e.url;img.alt=e.name;if(!contact)img.loading='lazy';button.append(img);button.setAttribute('aria-label','查看 '+e.name);
button.onclick=()=>{document.getElementById('large').src=e.url;document.getElementById('large').alt=e.name;document.getElementById('detailText').textContent=e.file+'\n'+e.category+' · '+e.origin+'\n'+e.width+' × '+e.height;document.getElementById('detail').showModal();};
const info=document.createElement('div');info.className='meta';const name=document.createElement('div');name.className='file';name.textContent=e.name;const detail=document.createElement('div');detail.textContent=e.width+' × '+e.height+' · '+e.category;info.append(name,detail);card.append(button,info);grid.append(card);}
document.getElementById('count').textContent=contact?'第 '+(page+1)+' 页 · '+items.length+' / '+total+' 项':'共 '+total+' 项 · 点击查看完整原图与相对路径';}
query.oninput=render;category.onchange=render;document.getElementById('close').onclick=()=>document.getElementById('detail').close();render();
</script></html>
